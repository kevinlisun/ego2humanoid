[project]
name = "ego2humanoid-perception-node"
version = "0.1.0"
description = "Perception node: intrinsics, gravity, objects (SAM3/OWLv2), scene, meshes (Hunyuan3D)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch @ https://download.pytorch.org/whl/cu128/torch-2.9.1%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl",
  "torchvision @ https://download.pytorch.org/whl/cu128/torchvision-0.24.1%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl",
  "transformers==5.23.0",
  "accelerate==1.15.0",
  "opencv-python-headless==5.0.0.93",
  "pillow==13.0.0",
  "scipy==1.17.1",
  "trimesh==5.2.1",
  "pymeshlab==2025.7.post1",
  "einops==0.8.2",
  "omegaconf==2.4.0",
  "diffusers==0.43.0",
  "huggingface_hub==2.4.0",
  "safetensors==0.8.0",
  "pygltflib==1.16.5",
  "numpy==2.2.6",
  "pyyaml",
  "moge @ git+https://github.com/microsoft/MoGe.git@74fbce054ebed49800de42d0ad0e83495065719a",
  "hy3dgen @ git+https://github.com/Tencent/Hunyuan3D-2.git@f8db63096c8282cb27354314d896feba5ba6ff8a",
]

[tool.uv]
package = false
# MoGe ships uv sources pointing torch at cu130; ignore dependency sources and pin cu128 wheels by URL.
no-sources = true
# opencv-python (non-headless) is pulled in by upstream pins; force headless only.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

