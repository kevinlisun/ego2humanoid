[project]
name = "ego2humanoid-node-tactile"
version = "0.1.0"
description = "EgoTac tactile inference node (scripts/estimate_tactile_egotac.py)"
requires-python = ">=3.10,<3.11"
# Versions follow third_party/EgoTac/environment.yaml (inference subset only).
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy==1.26.4",
    "timm==1.0.24",
    "hydra-core==1.3.2",
    "opencv-python-headless==4.11.0.86",
    "Pillow>=10,<12",
    "huggingface_hub==0.36.0",
    "accelerate==1.11.0",
    "diffusers==0.35.2",
    "dill==0.4.0",
    "zarr==2.16.0",
    "numcodecs==0.12.1",
    "imagecodecs==2025.3.30",
    "filelock==3.20.2",
    "threadpoolctl==3.6.0",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "tqdm==4.67.1",
    "PyYAML==6.0.3",
    "safetensors==0.7.0",
    "einops",
]

[tool.uv]
package = false
